name: plugin loads in Claude Code

# Installs every plugin listed in .claude-plugin/marketplace.json from this
# checkout into a scratch CLAUDE_CONFIG_DIR and fails if any does not reach
# "enabled". Catches load-layer breakage that schema validation misses.
#
# Deliberately unfiltered by `paths:`: 7 of ~10 top-level paths are plugin
# dirs, and a stale filter that silently skips the load gate is worse than
# running it on a docs-only PR.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Install every marketplace plugin into a scratch config
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-scratch"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          plugins=$(jq -r '.plugins[].name' .claude-plugin/marketplace.json)
          for p in $plugins; do
            claude plugin install "$p@cloudblue-agent-skills"
          done
          claude plugin list | tee plugin-list.txt
          for p in $plugins; do
            grep -A3 "$p@cloudblue-agent-skills" plugin-list.txt | grep -q "✔ enabled" || {
              echo "::error::$p plugin failed to load; see claude plugin list output above"
              exit 1
            }
          done
