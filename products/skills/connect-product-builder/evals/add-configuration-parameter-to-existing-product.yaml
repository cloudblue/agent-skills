# The taxonomy scenario: a value that varies per marketplace, not per
# subscription, is a Configuration parameter. Also guards the two things a
# narrow "add one parameter" request must not trigger — republishing the
# version, or re-running the product shell.
#
# `fixtures:` is deliberately absent: PRD-1234's state has to come from the G3
# mock, whose per-scenario fixture format is not defined yet. Add it — and add
# the products domain's delete / deactivate tool names to calls_forbidden —
# once tests/fixtures/catalog.json exists and those names can be quoted
# verbatim (G2).
name: add-configuration-parameter-to-existing-product
prompt: >-
  Our product PRD-1234 needs a provisioning API endpoint that is different for
  each distributor's marketplace. Add it as a parameter.
expect:
  calls_forbidden: [products_publish_version, products_manage]
